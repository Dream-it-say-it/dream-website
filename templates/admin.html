<!DOCTYPE html>
<html>
<head>
    <title>Dream Control Panel</title>

    <style>
        body {
            background: #0b0b0f;
            color: #e6e6e6;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            color: #ff3b3b;
        }

        .dream {
            background: #1a1a24;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .reply-box {
            margin-top: 10px;
        }

        .existing-reply {
            color: #ffcc00;
            margin-top: 10px;
            font-style: italic;
        }

        input, button {
            padding: 8px;
            margin-top: 5px;
        }

        button {
            background: #ff3b3b;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #ff1a1a;
        }

        .empty {
            color: #888;
            font-style: italic;
        }
    </style>
</head>

<body>

<h1>🔒 Dream Control Panel</h1>

{% if dreams %}
    {% for d in dreams %}
        <div class="dream">
            <p><b>User:</b> {{ d[1] }}</p>
            <p><b>Dream:</b> {{ d[2] }}</p>

            <!-- SHOW EXISTING REPLY -->
            {% if d|length > 3 and d[3] %}
                <p class="existing-reply">🧠 Your Response: {{ d[3] }}</p>
            {% endif %}

            <!-- Reply form -->
            <div class="reply-box">
                <form method="POST" action="/reply">
                    <input type="hidden" name="dream_id" value="{{ d[0] }}">
                    <input type="text" name="reply" placeholder="Write a response..." required>
                    <br>
                    <button type="submit">Send Response</button>
                </form>
            </div>
        </div>
    {% endfor %}
{% else %}
    <p class="empty">No dreams recorded yet...</p>
{% endif %}

</body>
</html>
