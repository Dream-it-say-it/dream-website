<!DOCTYPE html>
<html>
<head>
    <title>We Dreamed This</title>

    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: Arial;
            text-align: center;
        }

        textarea, input {
            width: 60%;
            padding: 10px;
            margin: 10px;
            background: #111;
            color: white;
            border: 1px solid #444;
        }

        button {
            padding: 10px 20px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        .dream {
            border: 1px solid #333;
            margin: 15px;
            padding: 15px;
            background: #0a0a0a;
        }
    </style>

</head>
<body>

<h1>🌙 WE DREAMED THIS</h1>

<h2 style="color:#aaa; font-weight:normal;">
    Have you seen them too?
</h2>

<p style="color:#666; font-size:14px;">
    Some people are dreaming the same beings...
</p>
<p>Have you seen this before?</p>

<form action="/submit" method="post">
    <input type="text" name="username" placeholder="Your name (or leave blank)">
    <br>
    <textarea name="dream" placeholder="Describe your dream..." required></textarea>
    <br>
    <button type="submit">Submit Dream</button>
</form>

<hr>

<h2>Recent Dreams</h2>

{% for username, dream in dreams %}
    <div class="dream">
        <strong>{{ username }}</strong><br><br>
        {{ dream }}
    </div>
{% endfor %}

</body>
</html>
