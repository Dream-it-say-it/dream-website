<!DOCTYPE html>
<html>
<head>
    <title>We Dreamed This</title>

    <style>
        body {
            background-color: black;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            letter-spacing: 2px;
        }

        textarea, input {
            width: 60%;
            padding: 10px;
            margin: 10px;
            background: #111;
            color: white;
            border: 1px solid #444;
        }

        button {
            padding: 10px 20px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .dream {
            border: 1px solid #333;
            margin: 15px auto;
            padding: 15px;
            background: #0a0a0a;
            width: 70%;
            text-align: left;
        }

        .warning {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 10px;
        }

        .subtitle {
            color: #888;
            font-weight: normal;
        }

        .small-text {
            color: #555;
            font-size: 13px;
        }
    </style>

</head>

<body>

<h1>🌙 WE DREAMED THIS</h1>

<h2 class="subtitle">Have you seen them too?</h2>

<p class="small-text">
    Some people are dreaming the same beings...<br>
    The same places...<br>
    The same silence.
</p>

<hr style="border:1px solid #222; width:60%;">

<!-- SUBMIT FORM -->
<form action="/submit" method="post">
    <input type="text" name="username" placeholder="Username (optional)">
    <br>
    <textarea name="dream" placeholder="Describe your dream..." required></textarea>
    <br>
    <button type="submit">Submit Dream</button>
</form>

<hr style="border:1px solid #222; width:60%;">

<h2>Recent Signals (hidden from public logic now)</h2>

<p class="small-text">
    Dreams are no longer publicly displayed.<br>
    They are being recorded elsewhere.
</p>

</body>
</html>
