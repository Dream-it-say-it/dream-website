<!DOCTYPE html>
<html>
<head>
    <title>We Dreamed This</title>

    <style>
        body {
            background: black;
            color: #cfcfcf;
            font-family: "Courier New", monospace;
            text-align: center;
        }

        h1 {
            letter-spacing: 3px;
        }

        .whisper {
            font-size: 12px;
            color: #666;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0% {opacity: 0.2;}
            50% {opacity: 1;}
            100% {opacity: 0.2;}
        }

        textarea, input {
            width: 60%;
            padding: 10px;
            background: #050505;
            color: white;
            border: 1px solid #222;
        }

        button {
            background: #111;
            color: white;
            border: 1px solid #333;
            padding: 10px;
            cursor: pointer;
        }

        .dream {
            border: 1px solid #222;
            margin: 20px;
            padding: 15px;
            background: #080808;
        }

        .username {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h1>🌙 WE DREAMED THIS</h1>
<p class="whisper">some people are seeing the same place...</p>

<form action="/submit" method="post">
    <input type="text" name="username" placeholder="identify yourself... or don't">
    <br>
    <textarea name="dream" placeholder="what did you see?" required></textarea>
    <br>
    <button type="submit">record it</button>
</form>

<hr>

<h2>RECENT ENTRIES</h2>

{% for username, dream in dreams %}
    <div class="dream">
        <div class="username">{{ username }}</div>
        <p>{{ dream }}</p>
    </div>
{% endfor %}

</body>
</html>
